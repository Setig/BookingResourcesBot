<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Booking Resources</title>
  <desc id="desc">A calendar card with booked resource slots and a confirmation mark.</desc>
  <defs>
    <linearGradient id="backgroundGradient" x1="96" y1="64" x2="416" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="surfaceGradient" x1="128" y1="112" x2="384" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E5EEFB"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="168" y1="250" x2="344" y2="338" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="cardShadow" x="78" y="76" width="356" height="380" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#backgroundGradient)"/>
  <path d="M112 122C112 102.1 128.1 86 148 86H364C383.9 86 400 102.1 400 122V388C400 407.9 383.9 424 364 424H148C128.1 424 112 407.9 112 388V122Z" fill="#0F172A" opacity="0.08"/>

