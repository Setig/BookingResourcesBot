    <rect x="152" y="350" width="56" height="44" rx="14"/>
    <rect x="228" y="350" width="56" height="44" rx="14"/>
  </g>

  <rect x="222" y="274" width="132" height="64" rx="20" fill="url(#accentGradient)"/>
  <circle cx="180" cy="236" r="10" fill="#2563EB"/>
  <circle cx="256" cy="236" r="10" fill="#2563EB"/>
  <circle cx="332" cy="236" r="10" fill="#2563EB"/>
  <circle cx="180" cy="304" r="10" fill="#2563EB" opacity="0.6"/>
