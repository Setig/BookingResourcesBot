    <rect x="104" y="88" width="304" height="336" rx="40" fill="url(#surfaceGradient)"/>
    <path d="M104 128C104 105.9 121.9 88 144 88H368C390.1 88 408 105.9 408 128V172H104V128Z" fill="#DBEAFE"/>
    <path d="M144 88H368C390.1 88 408 105.9 408 128V172H104V128C104 105.9 121.9 88 144 88Z" fill="#FFFFFF" opacity="0.48"/>
  </g>

  <rect x="154" y="58" width="36" height="88" rx="18" fill="#172033"/>
  <rect x="322" y="58" width="36" height="88" rx="18" fill="#172033"/>
  <rect x="160" y="58" width="24" height="78" rx="12" fill="#E5EEFB"/>
  <rect x="328" y="58" width="24" height="78" rx="12" fill="#E5EEFB"/>

  <g fill="#CBD5E1">
    <rect x="152" y="214" width="56" height="44" rx="14"/>
    <rect x="228" y="214" width="56" height="44" rx="14"/>
    <rect x="304" y="214" width="56" height="44" rx="14"/>
    <rect x="152" y="282" width="56" height="44" rx="14"/>
