<!doctype html>
<html lang="en" data-i18n-pending>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="set_password_title">Set password</title>
  <link rel="icon" type="image/svg+xml" href="/booking-resources.svg">
  <link rel="stylesheet" href="/styles.css">
  <script src="/locale-boot.js"></script>
  <script src="/theme.js" defer></script>
  <script src="/i18n.js" defer></script>
  <script src="/app.js" defer></script>
  <script src="/set-password.js" defer></script>
</head>
<body data-page="set-password">
  <main class="page page-with-actions centered-card">
    <div class="page-content">
      <section class="card">
        <h1 data-i18n="set_password_title">Set password</h1>
        <p class="muted" data-i18n="set_password_intro">Choose a password for the login assigned by the administrator.</p>
        <p id="setPasswordError" class="error" hidden></p>
        <p id="setPasswordStatus" class="status" hidden></p>
        <form id="setPasswordForm" class="form" action="/api/account/password-set" method="post" autocomplete="on">
          <label>
            <span data-i18n="login">Login</span>
            <input id="assignedLogin" name="login" type="text" autocomplete="username" readonly>
          </label>
          <label>
            <span data-i18n="new_password">New password</span>
            <input name="new_password" type="password" autocomplete="new-password" required>
          </label>
          <label>
            <span data-i18n="confirm_new_password">Confirm new password</span>
            <input name="confirm_new_password" type="password" autocomplete="new-password" required>
          </label>
          <button class="button primary" type="submit" data-i18n="set_password_button">Set password</button>
        </form>
        <div class="actions">
          <a class="button secondary" href="/authorize.html" data-i18n="go_to_sign_in">Go to sign in</a>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
