<!doctype html>
<html lang="en" data-i18n-pending>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="reset_password_title">Reset password</title>
  <link rel="icon" type="image/svg+xml" href="/booking-resources.svg">
  <link rel="stylesheet" href="/styles.css">
  <script src="/locale-boot.js"></script>
  <script src="/theme.js" defer></script>
  <script src="/i18n.js" defer></script>
  <script src="/app.js" defer></script>
  <script src="/reset-password.js" defer></script>
</head>
<body data-page="reset-password">
  <main class="page page-with-actions centered-card">
    <div class="page-content">
      <section class="card">
        <h1 data-i18n="reset_password_title">Reset password</h1>
        <p class="muted" data-i18n="reset_password_intro">Choose a new password for your web account.</p>
        <p id="resetPasswordError" class="error" hidden></p>
        <p id="resetPasswordStatus" class="status" hidden></p>
        <form id="resetPasswordForm" class="form" action="/api/account/password-reset" method="post" autocomplete="on">
          <label>
            <span data-i18n="new_password">New password</span>
            <input name="new_password" type="password" autocomplete="new-password" required>
          </label>
          <label>
            <span data-i18n="confirm_new_password">Confirm new password</span>
            <input name="confirm_new_password" type="password" autocomplete="new-password" required>
          </label>
          <button class="button primary" type="submit" data-i18n="reset_password_button">Reset password</button>
        </form>
        <div class="actions">
          <a class="button secondary" href="/authorize.html" data-i18n="go_to_sign_in">Go to sign in</a>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
